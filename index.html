<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
    <style>
        
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App Project
            
        </h1>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>
        <p class="loading" id="loading"></p>
        <p id="error" class="error"></p>
        <div id="result" class="result"></div>
    </div>

    <script>
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");
        const result = document.getElementById("result");
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");

        searchBtn.addEventListener("click",getWeather);

        async function getWeather(){
            const city = cityInput.value;
            result.innerHTML = "";
            error.innerHTML = "";

            loading.innerText = "Loading...";

            try{
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
                const data = await response.json();
                console.log(data);

                if(!data.results){
                    throw new Error("CITY NOT FOUND");

                }

                const lat = data.results[0].latitude;
                const lon = data.results[0].longitude;
                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);

                  const weatherData = await weatherResponse.json();


                  result.innerHTML = ` <h2>${city}</h2>

                  <p>🌡Temperature: ${weatherData.current_weather.temperature}</p>

                  <p> WindSpeed: ${weatherData.current_weather.windspeed}km/h</p>

                  <p>Wind Direction:${weatherData.current_weather.winddirection} </p>
                  <p>Time:${weatherData.current_weather.time}</p>
    

                  
                  `;




            }catch(err){
                error.innerHTML = err.message;

            }finally{
                 loading.innerText = "";
            }
        }





    </script>
</body>
</html>
