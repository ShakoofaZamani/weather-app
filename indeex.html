<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container{
            background: white;
            padding: 30px;
            width: 350px;
            border-radius: 10px;
            text-align: center;

        }
        h1{
            margin-bottom: 20px;

        }

        input{
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        button{
            padding: 10px 20px;
            border: none;
            background: #3498db;
            color: white;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover{
            background-color: #2980b9;
        }
        .result{
            margin-top: 20px;
        }
        .loading{
            color: orange;
            margin-top: 10px;
        }
        .error{
            color: red;
            margin-top: 10px;
        }



    </style>
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        <input type="text" id="cityInput" placeholder="Enter city name">
        <button id="searchBtn">Search</button>
        <p class="loading" id="loading"></p>
        <p id="error" class="error"></p>
        <div id="result" class="result"></div>
    </div>

    <script>
        const cityInput = document.getElementById("cityInput");
        const searchBtn = document.getElementById("searchBtn");
        const result = document.getElementById("result");
        const loading = document.getElementById("loading");
        const error = document.getElementById("error");

        searchBtn.addEventListener("click",getWeather);

        async function getWeather(){
            const city = cityInput.value;
            result.innerHTML = "";
            error.innerHTML = "";

            loading.innerText = "Loading...";

            try{
                const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1`);
                const data = await response.json();
                console.log(data);

                if(!data.results){
                    throw new Error("CITY NOT FOUND");

                }

                const lat = data.results[0].latitude;
                const lon = data.results[0].longitude;
                const weatherResponse = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`);

                  const weatherData = await weatherResponse.json();


                  result.innerHTML = ` <h2>${city}</h2>

                  <p>🌡Temperature: ${weatherData.current_weather.temperature}</p>

                  <p> WindSpeed: ${weatherData.current_weather.windspeed}km/h</p>

                  <p>Wind Direction:${weatherData.current_weather.winddirection} </p>
                  <p>Time:${weatherData.current_weather.time}</p>
    

                  
                  `;




            }catch(err){
                error.innerHTML = err.message;

            }finally{
                 loading.innerText = "";
            }
        }





    </script>
</body>
</html>
